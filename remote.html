<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0a1a">
<link rel="icon" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<title>Karaoke remote</title>
<style>
  :root{--bg:#0d0a1a;--card:#171230;--card2:#211a42;--fg:#f2eefc;--mut:#9e95bd;--acc:#ff3da8;--cyan:#2ee6ff;--line:#2d2552}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--fg);font:16px/1.45 system-ui,-apple-system,sans-serif;
    background:radial-gradient(90% 50% at 15% 0%,#ff3da822,transparent),radial-gradient(80% 50% at 88% 12%,#2ee6ff1c,transparent),var(--bg)}
  main{max-width:640px;margin:auto;padding:1.1em 1em 2.5em}
  h1,h2{margin:0;letter-spacing:-.01em}
  input,button{font:inherit;color:inherit;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:.68em .9em;min-height:44px}
  input::placeholder{color:var(--mut)}
  input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px #2ee6ff2e}
  button{cursor:pointer;font-weight:600;transition:transform .08s}
  button:active:not(:disabled){transform:scale(.97)}
  button:disabled{opacity:.45;cursor:default}
  button.primary{background:linear-gradient(105deg,var(--acc),#7a4dff 62%,var(--cyan));border:0;color:#fff;box-shadow:0 8px 24px #ff3da838}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  form{display:flex;gap:.55em;flex-wrap:wrap}form input{flex:1;min-width:140px}
  #code{font:700 18px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;max-width:11em}
  .hero{text-align:center;padding:1.4em 0 .6em}
  .hero img{width:104px;height:104px;border-radius:26px;box-shadow:0 16px 44px #000a;margin-bottom:.7em}
  .top{display:flex;align-items:center;gap:.75em;margin-bottom:.9em}
  .top img{width:44px;height:44px;border-radius:12px;flex:none}
  .pill{font:700 14px/1 ui-monospace,monospace;letter-spacing:.1em;padding:.45em .7em;border-radius:9px;background:var(--card2);border:1px solid var(--line);color:var(--cyan)}
  .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.9em 1em;margin:.75em 0;box-shadow:0 12px 32px #0005}
  .nowBox{background:linear-gradient(135deg,#241546,#141a38);border-color:#3d2f6e}
  .kicker{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin-bottom:.2em}
  .item{display:flex;gap:.75em;align-items:center;padding:.6em 0;border-top:1px solid var(--line)}
  .item:first-child{border-top:0;padding-top:.1em}.item:last-child{padding-bottom:.1em}
  .item img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;flex:none;background:#000}
  .item .grow{flex:1;min-width:0}.item .title{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item small{color:var(--mut);display:block;margin-top:.15em}
  .ctl{display:flex;gap:.5em;flex-wrap:wrap}
  .mut{color:var(--mut)}#msg{min-height:1.4em;margin:.5em .2em;font-size:14px;color:var(--cyan)}#msg.bad{color:#ff7aa8}
  a{color:var(--cyan);text-decoration:none;font-weight:600}a:hover{text-decoration:underline}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <section id="join">
    <div class="hero">
      <img src="/logo.png" alt="">
      <h1>Join the karaoke</h1>
      <p class="mut" id="joinMsg">Type the code shown on the TV, or scan its QR code.</p>
    </div>
    <form id="joinForm" class="box">
      <input id="code" maxlength="6" autocapitalize="characters" autocomplete="off" placeholder="CODE" aria-label="Room code" required>
      <input id="name" maxlength="30" autocomplete="nickname" placeholder="Your name" aria-label="Your name" required>
      <button class="primary">Join room</button>
    </form>
    <p class="mut" style="text-align:center;font-size:14px">Want this browser to play the songs? <a href="/tv">Use it as the TV screen →</a></p>
  </section>

  <section id="live" hidden>
    <header class="top">
      <img src="/logo.png" alt="">
      <div style="flex:1;min-width:0">
        <div class="kicker">Karaoke room</div>
        <div style="display:flex;align-items:baseline;gap:.5em;flex-wrap:wrap"><span class="pill" id="roomCode"></span><small class="mut" id="me"></small></div>
      </div>
      <button id="leave">Leave</button>
    </header>
    <div class="box nowBox" aria-live="polite">
      <div class="kicker">Now playing</div>
      <div style="font-weight:700;font-size:17px" id="now">Nothing yet</div>
      <div class="ctl" style="margin-top:.65em">
        <button data-act="pause" id="pp">⏸ Pause</button>
        <button data-act="skip">⏭ Next song</button>
      </div>
    </div>
    <form id="searchForm" role="search">
      <input id="q" type="search" maxlength="100" placeholder="Song, artist, or a YouTube link" aria-label="Search YouTube karaoke">
      <button class="primary">Search</button>
      <button type="button" id="trend">🔥 Trending</button>
    </form>
    <p id="msg" role="status"></p>
    <div class="box" id="results" hidden></div>
    <h2 style="font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:1.1em .2em .3em">Up next</h2>
    <div class="box" id="queue"></div>
  </section>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
let code = '', name = '', state = null;

// Build elements with text only, so titles from YouTube are never parsed as HTML.
function el(tag, text, attrs) {
  const n = document.createElement(tag);
  if (text != null) n.textContent = text;
  for (const k in attrs || {}) n.setAttribute(k, attrs[k]);
  return n;
}
function say(text, bad) { $('msg').textContent = text || ''; $('msg').className = bad ? 'bad' : ''; }
async function call(path, body) {
  try {
    const r = await fetch(path, body ? {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(Object.assign({code}, body))} : undefined);
    const d = await r.json();
    if (r.status === 403) leave(d.error);
    return r.ok ? d : Promise.reject(d.error || 'Something went wrong.');
  } catch (e) { return Promise.reject(typeof e === 'string' ? e : 'No connection to the karaoke. Trying again…'); }
}
const mins = s => s ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}` : '';

function row(v, extra, buttons) {
  const r = el('div', null, {class: 'item'});
  r.append(el('img', null, {src: `https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`, alt: '', loading: 'lazy'}));
  const t = el('div', null, {class: 'grow'});
  t.append(el('div', v.title, {class: 'title'}), el('small', extra));
  r.append(t, ...buttons);
  return r;
}
function button(text, label, fn, cls) { const b = el('button', text, Object.assign({'aria-label': label}, cls ? {class: cls} : {})); b.onclick = fn; return b; }

function paint(s) {
  state = s;
  $('roomCode').textContent = s.code;
  $('now').textContent = s.current ? `${s.current.title} · sung by ${s.current.by}` : 'Nothing yet. Reserve a song below.';
  $('pp').textContent = s.paused ? '▶ Play' : '⏸ Pause';
  $('pp').dataset.act = s.paused ? 'play' : 'pause';
  const list = s.queue.map((q, i) => row(q, `${i + 1}. ${q.by}${q.channel ? ' · ' + q.channel : ''}`, [
    ...(i ? [button('⤒', `Play “${q.title}” next`, () => act('top', q.n))] : []),
    button('✕', `Remove “${q.title}”`, () => act('remove', q.n)),
  ]));
  $('queue').replaceChildren(...(list.length ? list : [el('p', 'Nothing reserved yet.', {class: 'mut', style: 'margin:.2em 0'})]));
}
function act(action, item) { call('/api/control', {action, item}).then(paint, e => say(e, true)); }
document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(b.dataset.act));

$('searchForm').onsubmit = e => { e.preventDefault(); find($('q').value.trim()); };
$('trend').onclick = () => { $('q').value = ''; find(''); };
async function find(q) {
  say(q ? 'Searching YouTube…' : 'Loading trending karaoke…');
  try {
    const d = await call(`/api/search?code=${encodeURIComponent(code)}&q=${encodeURIComponent(q)}`);
    say(!d.results.length ? 'No karaoke videos found. Try the artist name, or paste a YouTube link.'
        : q ? '' : 'Trending: most viewed karaoke on YouTube this year');
    $('results').hidden = !d.results.length;
    $('results').replaceChildren(...d.results.map(v => row(v, [v.channel, mins(v.duration)].filter(Boolean).join(' · '), [
      button('＋ Reserve', `Reserve “${v.title}”`, ev => {
        call('/api/reserve', {name, id: v.id, title: v.title, channel: v.channel})
          .then(s => { paint(s); say(`Reserved “${v.title}”.`); ev.target.textContent = '✓ Queued'; ev.target.disabled = true; }, err => say(err, true));
      }, 'primary'),
    ])));
  } catch (err) { say(err, true); }
}

function poll() {
  if (!code) return;
  call('/api/state?code=' + encodeURIComponent(code)).then(paint, () => {}).finally(() => setTimeout(poll, document.hidden ? 6000 : 2000));
}
async function join(c, n) {
  code = c.trim().toUpperCase(); name = n.trim();
  try {
    paint(await call('/api/state?code=' + encodeURIComponent(code)));
  } catch (e) { code = ''; $('joinMsg').textContent = e; $('joinMsg').style.color = '#ff7aa8'; return; }
  localStorage.setItem('karaoke.join', JSON.stringify({code, name}));
  history.replaceState(null, '', '/?code=' + code);
  $('me').textContent = 'signed in as ' + name;
  $('join').hidden = true; $('live').hidden = false;
  poll();
  if ($('results').hidden) find('');
}
function leave(why) {
  code = ''; localStorage.removeItem('karaoke.join');
  $('live').hidden = true; $('join').hidden = false;
  if (why) { $('joinMsg').textContent = why; $('joinMsg').style.color = '#ff7aa8'; }
}
$('leave').onclick = () => leave();
$('joinForm').onsubmit = e => { e.preventDefault(); join($('code').value, $('name').value); };

const saved = JSON.parse(localStorage.getItem('karaoke.join') || 'null');
const urlCode = new URLSearchParams(location.search).get('code') || '';
$('code').value = urlCode || saved?.code || '';
$('name').value = saved?.name || '';
if (saved && saved.name && (!urlCode || urlCode.toUpperCase() === saved.code)) join(saved.code, saved.name);
else ($('code').value ? $('name') : $('code')).focus();
</script>
</body>
</html>
