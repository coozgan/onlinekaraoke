# Start: TV_KEY=$(cat ~/.config/karaoke/tv_key) docker compose up -d --build
# In the Cloudflare dashboard, point karaoke.joshyfruit.com to http://karaoke:8010
services:
  karaoke:
    build: .
    restart: unless-stopped
    environment:
      TV_KEY: ${TV_KEY:?run with TV_KEY=$(cat ~/.config/karaoke/tv_key)}
      PUBLIC_URL: https://karaoke.joshyfruit.com
    ports:
      - "${HOST_PORT:-8010}:8010"  # phones on your Wi-Fi can still use http://<mac-ip>:8010
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token-file /run/secrets/tunnel_token
    secrets: [tunnel_token]
    depends_on: [karaoke]

secrets:
  tunnel_token:
    file: ${HOME}/.config/karaoke/tunnel_token
