<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0a1a">
<link rel="icon" href="/logo.png">
<title>Karaoke TV</title>
<style>
  :root{--bg:#0d0a1a;--card:#171230;--line:#2d2552;--fg:#f2eefc;--mut:#9e95bd;--pink:#ff3da8;--cyan:#2ee6ff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:18px/1.4 system-ui,-apple-system,sans-serif;overflow:hidden}
  #player,#player iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  .full{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:1.1rem;padding:4vh 5vw;text-align:center;
    background:radial-gradient(45% 45% at 22% 52%,#ff3da826,transparent),radial-gradient(45% 45% at 78% 48%,#2ee6ff22,transparent),var(--bg)}
  .full[hidden]{display:none}
  .logo{width:min(18vh,136px);aspect-ratio:1;border-radius:26%;box-shadow:0 16px 48px #0009}
  h1{margin:0;font-size:clamp(28px,4.2vw,52px);letter-spacing:-.02em}
  .stage{display:grid;grid-template-columns:auto 1fr;gap:clamp(24px,4vw,56px);align-items:center;text-align:left;
    background:var(--card);border:1px solid var(--line);border-radius:28px;padding:clamp(22px,3.4vh,40px) clamp(26px,3.8vw,48px);box-shadow:0 24px 64px #000a}
  #qr{width:min(36vh,300px);aspect-ratio:1;background:#fff;padding:12px;border-radius:18px;display:block}
  .kicker{font-size:14px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
  .code{font:800 clamp(44px,7.2vw,92px)/1.05 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;margin:.08em 0 .15em;
    background:linear-gradient(95deg,var(--pink),#b967ff 52%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  .mut{color:var(--mut);margin:0}
  button{font:600 24px/1 inherit;padding:.75em 1.6em;border-radius:14px;border:0;color:#fff;cursor:pointer;
    background:linear-gradient(100deg,var(--pink),#7a4dff 60%,var(--cyan));box-shadow:0 10px 32px #ff3da840}
  button:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
  .bar{position:fixed;left:2vw;right:2vw;bottom:2.2vh;display:flex;gap:1.2em;align-items:center;padding:.65em 1.1em;
    background:#120d26e6;border:1px solid var(--line);border-radius:16px;font-size:20px;transition:opacity .4s}
  .bar img{width:34px;height:34px;border-radius:8px}
  .bar b{color:var(--pink)}.bar .codeTag{font-family:ui-monospace,monospace;letter-spacing:.08em;color:var(--cyan)}
  .bar .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar.quiet{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="player"></div>
<div class="full" id="start">
  <img class="logo" src="/logo.png" alt="">
  <h1>Karaoke TV</h1>
  <p class="mut">Browsers only play sound after a click.</p>
  <button id="go">Start the screen</button>
</div>
<div class="full" id="idle" hidden>
  <div class="stage">
    <img id="qr" alt="QR code to join this karaoke room">
    <div>
      <div style="display:flex;align-items:center;gap:.7em;margin-bottom:.9em">
        <img src="/logo.png" alt="" style="width:48px;height:48px;border-radius:12px">
        <div><div style="font-weight:700">Karaoke Room</div><p class="mut" style="font-size:15px">Scan the QR code or enter the room code on your phone</p></div>
      </div>
      <div class="kicker">Room code</div>
      <div class="code" id="code">······</div>
      <p class="mut" id="link"></p>
    </div>
  </div>
</div>
<div class="bar quiet" id="bar"><img src="/logo.png" alt=""><span class="grow">Now: <b id="now"></b></span><span id="next" class="mut grow"></span><span>Room <b class="codeTag" id="code2"></b></span></div>
<div class="full" id="err" hidden><h1>This screen can't open a room</h1><p class="mut">Clear the site data and reload.</p></div>
<script>
'use strict';
// This screen makes its own secret key once and keeps it, so it gets the same room code every time.
// A #key in the link still wins, so older TV app builds keep their room.
const key = location.hash.slice(1) || localStorage.getItem('karaoke.tv') ||
  [...crypto.getRandomValues(new Uint8Array(18))].map(b => b.toString(16).padStart(2, '0')).join('');
localStorage.setItem('karaoke.tv', key);
const $ = id => document.getElementById(id);
let yt = null, playing = null, paused = false, last = 0;

const post = (path, body) => fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'},
  body: JSON.stringify(Object.assign({key}, body))}).then(r => r.json()).catch(() => null);

function ended() { if (playing) post('/api/ended', {item: playing.n}); }

function show(s) {
  if ($('code').textContent !== s.code) $('qr').src = '/qr.svg?code=' + s.code;
  $('code').textContent = $('code2').textContent = s.code;
  $('link').textContent = s.join;
  $('idle').hidden = !!s.current;
  $('now').textContent = s.current ? `${s.current.title} · ${s.current.by}` : '';
  $('next').textContent = s.queue.length ? `Next: ${s.queue[0].title} · ${s.queue[0].by}` : 'Queue is empty';
  if (!s.current) { if (playing) yt.stopVideo(); playing = null; return; }
  if (!playing || playing.n !== s.current.n) {
    playing = s.current; paused = false; yt.loadVideoById(s.current.id);
    $('bar').classList.remove('quiet'); clearTimeout(last); last = setTimeout(() => $('bar').classList.add('quiet'), 8000);
  }
  if (s.paused !== paused) { paused = s.paused; paused ? yt.pauseVideo() : yt.playVideo(); }
}

function poll() {
  fetch('/api/state?key=' + encodeURIComponent(key)).then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(show, code => {
      if (code !== 403) return;
      // Our code is taken by another TV (about 1 in 20 million): make a new key, which gives a new code.
      if (!location.hash) { localStorage.removeItem('karaoke.tv'); location.reload(); }
      else $('err').hidden = false;
    })
    .finally(() => setTimeout(poll, 1500));
}

window.onYouTubeIframeAPIReady = () => {
  yt = new YT.Player('player', {
    host: 'https://www.youtube-nocookie.com', width: '100%', height: '100%',
    playerVars: {autoplay: 1, controls: 0, rel: 0, playsinline: 1, origin: location.origin},
    events: {
      onReady: poll,
      onStateChange: e => { if (e.data === YT.PlayerState.ENDED) ended(); },
      // 2 bad id, 5 HTML5 error, 100 removed, 101/150 owner blocks embedding: skip to the next song
      onError: ended,
    },
  });
};

$('go').onclick = () => {
  $('start').hidden = true;
  document.documentElement.requestFullscreen?.().catch(() => {});
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.append(s);
};
if (/KaraokeTV/.test(navigator.userAgent)) $('go').click();  // the TV app allows sound without a click
</script>
</body>
</html>
