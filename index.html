<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Songerist (local clone)</title>
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="beta" id="beta" role="status"><b>BETA</b> Local clone. Data stays in this browser. <button id="betaX" aria-label="Hide this notice">✕</button></div>
<header class="top">
  <button id="menu" aria-controls="side" aria-expanded="false" aria-label="Menu">☰</button>
  <a class="brand" href="#/">Songerist</a>
  <span class="title" id="pageTitle">Home</span>
  <span class="spacer"></span>
  <button id="searchOpen" aria-haspopup="dialog">🔍 Search <kbd>Ctrl K</kbd></button>
  <button id="theme" role="switch" aria-checked="true" aria-label="Dark mode">☾</button>
</header>
<aside class="side" id="side" aria-label="Songerist">
  <p>Discover</p>
  <a href="#/">Home</a>
  <a href="#/chords">Chords Feed</a>
  <p>Karaoke</p>
  <a href="#/karaoke">Online Karaoke</a>
  <a href="#/rooms">Rooms</a>
  <a href="#/challenge">Weekly Challenge</a>
  <p>Make and play</p>
  <a href="#/studio">Studio</a>
  <p>Help</p>
  <a href="#/about">About</a>
</aside>
<main id="view" tabindex="-1"></main>
<dialog id="search" aria-label="Search">
  <input id="q" type="search" maxlength="80" placeholder="Search songs, people, posts…" aria-label="Search">
  <div id="results" role="listbox"></div>
</dialog>
<dialog id="card" aria-labelledby="cardTitle">
  <button class="x" id="cardX" aria-label="Close">×</button>
  <h2 id="cardTitle"></h2><p id="cardSub"></p><div id="cardActions" class="row"></div>
</dialog>
</body>
</html>
